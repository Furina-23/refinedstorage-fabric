plugins {
    id 'fabric-loom' version '1.6.12'
    id 'maven-publish'
}

group = 'com.refinedmods'
version = project.findProperty('mod_version') ?: '1.12.4-fabric.1'

base {
    archivesName = 'refinedstorage'
}

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    mavenCentral()
}

dependencies {
    minecraft 'com.mojang:minecraft:1.20.1'
    mappings loom.officialMojangMappings()
    modImplementation 'net.fabricmc:fabric-loader:0.19.5'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.92.12+1.20.1'
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
}

sourceSets {
    main {
        resources.srcDir 'src/generated/resources'
        java {
            // Model generation still uses Forge's generator DSL. Server data
            // providers run through Fabric's data generation entrypoint.
            exclude 'com/refinedmods/refinedstorage/datageneration/BlockModelGenerator.java'
            exclude 'com/refinedmods/refinedstorage/datageneration/BlockModels.java'
            exclude 'com/refinedmods/refinedstorage/integration/jei/CoverCraftingCategoryExtension.java'
            exclude 'com/refinedmods/refinedstorage/integration/jei/GhostIngredientHandler.java'
            exclude 'com/refinedmods/refinedstorage/integration/jei/GridRecipeTransferHandler.java'
            exclude 'com/refinedmods/refinedstorage/integration/jei/GuiContainerHandler.java'
            exclude 'com/refinedmods/refinedstorage/integration/jei/HollowCoverCraftingCategoryExtension.java'
            exclude 'com/refinedmods/refinedstorage/integration/jei/Ingredient.java'
            exclude 'com/refinedmods/refinedstorage/integration/jei/IngredientTracker.java'
            exclude 'com/refinedmods/refinedstorage/integration/jei/JeiHelper.java'
            exclude 'com/refinedmods/refinedstorage/integration/jei/RecipeTransferCraftingGridError.java'
            exclude 'com/refinedmods/refinedstorage/integration/jei/RecipeTransferPatternGridError.java'
            exclude 'com/refinedmods/refinedstorage/integration/jei/RSJeiPlugin.java'
            exclude 'com/refinedmods/refinedstorage/render/model/DiskDriveGeometryLoader.java'
            exclude 'com/refinedmods/refinedstorage/render/model/DiskManipulatorGeometryLoader.java'
            exclude 'com/refinedmods/refinedstorage/render/model/PortableGridGeometryLoader.java'
            exclude 'com/refinedmods/refinedstorage/setup/ClientSetup.java'
        }
    }
}

fabricApi {
    configureDataGeneration {
        outputDirectory = file('src/generated/resources')
    }
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.compilerArgs.addAll(['-Xmaxerrs', '1000'])
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    withSourcesJar()
}

jar {
    from('LICENSE.md') {
        rename { "${it}_refinedstorage" }
    }
}

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            from components.java
        }
    }
}
